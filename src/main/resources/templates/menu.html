<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Cache-Control" content="no-cache">
<meta http-equiv="Expires" content="Thu, 01 Dec 1994 16:00:00 GMT">
<title>メニュー画面</title>
<link rel="stylesheet" media="all" th:href="@{/css/NewFile.css}" />
<script type="text/javascript" th:src="@{/js/common.js}"></script>
<script type="text/javascript" th:src="@{/js/message.js}"></script>
</head>

<body>
	<div id="wrapper">
		<div id="header">
			<table class="full-width">
				<tr>
					<td id="headLeft"></td>
					<td id="headCenter">
						<div th:if="${authority_id == adminAuthority}">メニュー(管理者)</div>
						<div th:if="${authority_id == userAuthority}">メニュー(一般)</div>
					</td>
					<td id="headRight"><input value="ログアウト" type="button"
						class="smallButton" onclick="logout()" /></td>
				</tr>
			</table>
		</div>
		<div id="businessBody">
			<div class="menuContainer">
				<div th:if="${authority_id == adminAuthority}" style="margin: auto;">

					<div class="menuBlock">
						<form action="/kikin/monthlyShiftCheck">
							<input type="submit" value="月別シフト確認" class="bigButton" />
						</form>
						<br>
						<form action="/kikin/dailyShift" method="post">
							<input type="submit" value="日別シフト確認" class="bigButton" />
						</form>
					</div>

					<div class="menuBlock">
						<form action="/kikin/workRecordCheck">
							<input type="submit" value="勤務実績確認" class="bigButton" />
						</form>
						<br>
						<form action="/kikin/workRecordInput">
							<input type="submit" value="勤務実績入力" class="bigButton" />
						</form>
					</div>

					<div class="menuBlock">
						<form action="/kikin/workDateRequestCheck">
							<input type="submit" value="出勤希望日確認" class="bigButton" />
						</form>
						<br>
						<form action="/kikin/monthlyShiftInput">
							<input type="submit" value="月別シフト入力" class="bigButton" />
						</form>
					</div>

					<div class="menuBlock">
						<form action="/kikin/shiftMstMnt">
							<input type="submit" value="シフトマスタメンテナンス" class="bigButton" />
						</form>
						<br>
						<form action="/kikin/employeeMstMnt">
							<input type="submit" value="社員マスタメンテナンス" class="bigButton" />
						</form>
						<br>
						<form action="/kikin/baseShiftInput">
							<input type="submit" value="基本シフト登録" class="bigButton" />
						</form>

					</div>
				</div>
				<div th:if="${authority_id == userAuthority}" style="margin: auto;">
					<div class="menuBlock">
						<form action="/kikin/monthlyShiftCheck">
							<input type="submit" value="月別シフト確認" class="bigButton" />
						</form>
						<br>
						<form action="/kikin/dailyShift">
							<input type="submit" value="日別シフト確認" class="bigButton" />
						</form>
					</div>

					<div class="menuBlock">
						<form action="/kikin/workRecordInput">
							<input type="submit" value="勤務実績入力" class="bigButton" />
						</form>
					</div>

					<div class="menuBlock">
						<form action="/kikin/workDateRequestInput" method="post">
							<input type="submit" value="出勤希望日入力" class="bigButton" />
						</form>
						<br>
						<form action="/kikin/workDateRequestCheck">
							<input type="submit" value="出勤希望日確認" class="bigButton" />
						</form>
					</div>

					<div class="menuBlock">
						<form action="/kikin/BaseShiftCheck">
							<input type="submit" value="基本シフト確認" class="bigButton" />
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
	
	<!-- 川・波なみアニメーション -->
	<div class="river">
		<!-- 奥の波 -->
		<svg class="wave wave-back"
			viewBox="0 24 150 28"
			preserveAspectRatio="none"
			shape-rendering="auto">
			<defs>
			<path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
        </defs>
        <g class="parallax">
          <use href="#gentle-wave" x="48" y="0"
				fill="rgba(184, 232, 245, 0.7)" />
          <use href="#gentle-wave" x="48" y="3"
				fill="rgba(141, 211, 230, 0.5)" />
        </g>
      </svg>

		<!-- 手前の波（メインの川） -->
		<svg class="wave wave-front" viewBox="0 24 150 28"
			preserveAspectRatio="none" shape-rendering="auto">
        <g class="parallax">
          <use href="#gentle-wave" x="48" y="5"
				fill="rgba(112, 194, 218, 0.8)" />
          <use href="#gentle-wave" x="48" y="7" fill="#5BB2CE" />
        </g>
      </svg>

		<!-- 水面の光 -->
		<div class="water-light"></div>

		<!-- どんぶらこ桃 -->
		<div class="momo">
			🍑
			<div class="ripple"></div>
		</div>

	</div>

	<div id="footer">
		<table>
			<tr>
				<td id="footLeft"></td>
				<td id="footCenter"></td>
				<td id="footRight"></td>
			</tr>
		</table>
	</div>
</body>

</html>
