<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-Control" content="no-cache">
    <meta http-equiv="Expires" content="Thu, 01 Dec 1994 16:00:00 GMT">
    <title>シフト凡例</title>
    <link rel="stylesheet" media="all" th:href="@{/css/NewFile.css}" />
    <script type="text/javascript" th:src="@{/js/common.js}"></script>
    <script type="text/javascript" th:src="@{/js/message.js}"></script>
    <style>
        /* レイアウト調整用CSS */
        .shift-table-container {
            width: 490px;            /* 上部ヘッダー（490px）と幅を合わせる */
            max-height: 50vh;        /* 件数が多い時のみ画面高さ半分までスクロール */
            overflow-y: auto;        /* 溢れた場合のみ縦スクロール */
            border: 1px solid #000000;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .shift-table {
            width: 100%;
            border-collapse: collapse;
            background-color: #ffffff;
            table-layout: fixed;     /* 列幅を割合固定 */
        }

        .shift-table th,
        .shift-table td {
            border: 1px solid #000000;
            padding: 12px 6px;       /* セルの上下余白を広げて表を大きく表示 */
            font-size: 15px;         /* 文字を大きく */
            white-space: nowrap;     /* テキストの自動改行を防止 */
            word-break: keep-all;
        }

        .shift-table th {
            position: sticky;
            top: 0;
            background-color: #3b8ea5; /* ヘッダーと同系の青色 */
            color: #ffffff;
            font-weight: bold;
            z-index: 1;
        }

        /* 列の幅比率（合計100%） */
        .col-name   { width: 32%; }  /* 「研修(学生)」が入るよう少し広め */
        .col-symbol { width: 18%; }
        .col-time   { width: 32%; }
        .col-break  { width: 18%; }

        .shift-table tbody tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        .shift-table tbody tr:hover {
            background-color: #e9ecef;
        }
    </style>
</head>

<body>
    <div id="wrapper" style="width: 490px; margin: 0 auto;">
        <div id="header" style="width:490px;">
            <table>
                <tr>
                    <td id="headLeft"></td>
                    <td id="headCenter">シフト凡例</td>
                    <td id="headRight"></td>
                </tr>
            </table>
        </div>

        <div id="businessBody" style="width:490px; margin-top: 15px;">
            <form method="post" th:object="${shiftPatternForm}">
                <div id="pattern">
                    <!-- 表エリア -->
                    <div class="shift-table-container">
                        <table class="shift-table">
                            <thead>
                                <tr>
                                    <th class="col-name" style="text-align: center;">シフト名</th>
                                    <th class="col-symbol" style="text-align: center;">シンボル</th>
                                    <th class="col-time" style="text-align: center;">時間</th>
                                    <th class="col-break" style="text-align: center;">休憩</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="shiftPatternBean : ${shiftPatternBeanList}">
                                    <td style="text-align: center;" th:text="${shiftPatternBean.shiftName}">通常</td>
                                    <td style="text-align: center;" th:text="${shiftPatternBean.symbol}">日</td>
                                    <td style="text-align: center;" th:text="${shiftPatternBean.timeZone}">08:00~16:00</td>
                                    <td style="text-align: center;" th:text="${shiftPatternBean.breakTime}">01:00</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </form>
        </div>

        <div id="footer" style="width:490px;">
            <table>
                <tr>
                    <td id="footLeft"></td>
                    <td id="footCenter"></td>
                    <td id="footRight"></td>
                </tr>
            </table>
        </div>
    </div>
</body>

</html>
