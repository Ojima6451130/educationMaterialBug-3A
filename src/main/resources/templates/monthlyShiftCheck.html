<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Cache-Control" content="no-cache">
  <meta http-equiv="Expires" content="Thu, 01 Dec 1994 16:00:00 GMT">
  <title>月別シフト確認画面</title>
  <link rel="stylesheet" media="all" th:href="@{/css/NewFile.css}" />
  <script type="text/javascript" th:src="@{/js/common.js}"></script>
  <script type="text/javascript" th:src="@{/js/message.js}"></script>
</head>

<body id="sibakari">
  <div id="wrapper">
    <div id="header">
      <table class="centered-container">
        <tr>
          <td id="headLeft">
            <form action="/kikin/menu" method="post">
              <input value="戻る" type="submit" class="smallButton" />
            </form>
          </td>
          <td id="headCenter">
            月別シフト確認
          </td>
          <td id="headRight">
            <input value="ログアウト" type="button" class="smallButton" onclick="logout()" />
          </td>
        </tr>
      </table>
    </div>
    <div>
      <form id="sibakariSearchForm" action="/kikin/monthlyShiftCheck/search" method="post" th:object="${MonthlyShiftCheckForm}">
        <label >表示年月：</label>
        <select name="yearMonth" id="yearMonth" style="width: 5%; color: black;">
            <option th:each="yearMonth : ${yearMonthValues}" th:value="${yearMonth}" th:selected="${yearMonth} == *{yearMonth}" th:inline="text" inputmode="text">[[${yearMonth}]]</option>
        </select>
        <input value="検索" type="submit" class="smallButton" style="width: 60px; height: 26px;" />
      </form>
    </div>
    <div id="businessBody">
      <table class="sibakariDaysTable">
        <thead style="display: block; position: sticky;">
          <tr class="tableHeader">
            <td style="width: 150px; text-align: center;">
              &nbsp;
            </td>
            <td th:each="dateBean : ${dateBeanList}" style="width: 40px; text-align: center;">
              <span th:text="${dateBeanStat.count}"></span>
            </td>
          </tr>
          <tr class="tableHeader">
            <td style="width: 150px; text-align: center; white-space: nowrap;">
              社員名
            </td>
            <td th:each="dateBean : ${dateBeanList}" style="width: 40px; text-align: center; vertical-align: middle;">
              <span th:if="${dateBean.weekDay == saturday && !dateBean.publicHolidayFlg}" th:value="${dateBean.weekDay}" style="color: blue;">[[${dateBean.weekDay}]]</span>
              <span th:if="${dateBean.weekDay == sunday || dateBean.publicHolidayFlg}" th:value="${dateBean.weekDay}" style="color: red;">[[${dateBean.weekDay}]]</span>
              <span th:unless="${dateBean.weekDay == saturday || dateBean.weekDay == sunday || dateBean.publicHolidayFlg}" 
                        th:value="${dateBean.weekDay}" style="color: black;">[[${dateBean.weekDay}]]</span>
            </td>
          </tr>
        </thead>
        <tbody style="display: block; max-height: 400px; overflow-y: scroll;">
          <tr th:each="monthlyShiftCheck : ${monthlyShiftCheckBean}" class="tableBody">
            <td class="tableBody" style="width: 150px; text-align: center;">
              <span th:text="${monthlyShiftCheck.employeeName}"></span>
            </td>
            <td class="tableBody" style="width: 40px; text-align: center;" th:text="${monthlyShiftCheck.symbol01}"></td>
            <td class="tableBody" style="width: 40px; text-align: center;" th:text="${monthlyShiftCheck.symbol02}"></td>
            <td class="tableBody" style="width: 40px; text-align: center;" th:text="${monthlyShiftCheck.symbol03}"></td>
            <td class="tableBody" style="width: 40px; text-align: center;" th:text="${monthlyShiftCheck.symbol04}"></td>
            <td class="tableBody" style="width: 40px; text-align: center;" th:text="${monthlyShiftCheck.symbol05}"></td>
            <td class="tableBody" style="width: 40px; text-align: center;" th:text="${monthlyShiftCheck.symbol06}"></td>
            <td class="tableBody" style="width: 40px; text-align: center;" th:text="${monthlyShiftCheck.symbol07}"></td>
            <td class="tableBody" style="width: 40px; text-align: center;" th:text="${monthlyShiftCheck.symbol08}"></td>
            <td class="tableBody" style="width: 40px; text-align: center;" th:text="${monthlyShiftCheck.symbol09}"></td>
            <td class="tableBody" style="width: 40px; text-align: center;" th:text="${monthlyShiftCheck.symbol10}"></td>
            <td class="tableBody" style="width: 40px; text-align: center;" th:text="${monthlyShiftCheck.symbol11}"></td>
            <td class="tableBody" style="width: 40px; text-align: center;" th:text="${monthlyShiftCheck.symbol12}"></td>
            <td class="tableBody" style="width: 40px; text-align: center;" th:text="${monthlyShiftCheck.symbol13}"></td>
            <td class="tableBody" style="width: 40px; text-align: center;" th:text="${monthlyShiftCheck.symbol14}"></td>
            <td class="tableBody" style="width: 40px; text-align: center;" th:text="${monthlyShiftCheck.symbol15}"></td>
            <td class="tableBody" style="width: 40px; text-align: center;" th:text="${monthlyShiftCheck.symbol16}"></td>
            <td class="tableBody" style="width: 40px; text-align: center;" th:text="${monthlyShiftCheck.symbol17}"></td>
            <td class="tableBody" style="width: 40px; text-align: center;" th:text="${monthlyShiftCheck.symbol18}"></td>
            <td class="tableBody" style="width: 40px; text-align: center;" th:text="${monthlyShiftCheck.symbol19}"></td>
            <td class="tableBody" style="width: 40px; text-align: center;" th:text="${monthlyShiftCheck.symbol20}"></td>
            <td class="tableBody" style="width: 40px; text-align: center;" th:text="${monthlyShiftCheck.symbol21}"></td>
            <td class="tableBody" style="width: 40px; text-align: center;" th:text="${monthlyShiftCheck.symbol22}"></td>
            <td class="tableBody" style="width: 40px; text-align: center;" th:text="${monthlyShiftCheck.symbol23}"></td>
            <td class="tableBody" style="width: 40px; text-align: center;" th:text="${monthlyShiftCheck.symbol24}"></td>
            <td class="tableBody" style="width: 40px; text-align: center;" th:text="${monthlyShiftCheck.symbol25}"></td>
            <td class="tableBody" style="width: 40px; text-align: center;" th:text="${monthlyShiftCheck.symbol26}"></td>
            <td class="tableBody" style="width: 40px; text-align: center;" th:text="${monthlyShiftCheck.symbol27}"></td>
            <td class="tableBody" style="width: 40px; text-align: center;" th:text="${monthlyShiftCheck.symbol28}"></td>
            <td th:if="${dateBeanList.size() > 28}" class="tableBody" style="width: 40px; text-align: center;" th:text="${monthlyShiftCheck.symbol29}"></td>
            <td th:if="${dateBeanList.size() > 29}" class="tableBody" style="width: 40px; text-align: center;" th:text="${monthlyShiftCheck.symbol30}"></td>
            <td th:if="${dateBeanList.size() > 30}" class="tableBody" style="width: 40px; text-align: center;" th:text="${monthlyShiftCheck.symbol31}"></td>
          </tr>
        </tbody>
      </table>
    </div>
    <!-- 川・波なみアニメーション -->
	<div class="river">
		<!-- 奥の波 -->
		<svg class="wave wave-back"
			viewBox="0 24 150 28"
			preserveAspectRatio="none"
			shape-rendering="auto">
			<defs>
			<path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
        </defs>
        <g class="parallax">
          <use href="#gentle-wave" x="48" y="0"
				fill="rgba(184, 232, 245, 0.7)" />
          <use href="#gentle-wave" x="48" y="3"
				fill="rgba(141, 211, 230, 0.5)" />
        </g>
      </svg>

		<!-- 手前の波（メインの川） -->
		<svg class="wave wave-front" viewBox="0 24 150 28"
			preserveAspectRatio="none" shape-rendering="auto">
        <g class="parallax">
          <use href="#gentle-wave" x="48" y="5"
				fill="rgba(112, 194, 218, 0.8)" />
          <use href="#gentle-wave" x="48" y="7" fill="#5BB2CE" />
        </g>
      </svg>

		<!-- 水面の光 -->
		<div class="water-light"></div>

		<!-- どんぶらこ桃 -->
		<div class="momo">
			🍑
			<div class="ripple"></div>
		</div>

	</div>
    <div id="footer" >
      <table>
        <tr>
          <td id="footLeft">
            <input value="凡例表示" type="button" class="longButton" onclick="openWindow()" />
            <form id="excelForm" action="/kikin/monthlyShiftCheck/print" method="post" th:object="${MonthlyShiftCheckForm}">
              <input id="yearMonth" type="hidden" th:field="*{yearMonth}" th:value="${yearMonth}">
              <input type="submit" class="smallButton" id="btn_excel" value="印刷">
            </form>
          </td>
          <td id="footCenter" style="text-align: right;">
          </td>
          <td id="footRight">
          </td>
        </tr>
      </table>
    </div>
  </div>
</body>

</html>
