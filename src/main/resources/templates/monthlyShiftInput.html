<!DOCTYPE html>

<head>

  <title>月別シフト入力画面</title>
  <link rel="stylesheet" media="all" th:href="@{/css/NewFile.css}" />
  <script type="text/javascript" th:src="@{/js/common.js}"></script>
  <script type="text/javascript" th:src="@{/js/message.js}"></script>
  <style>
    /* テーブル部分のスクロールと余白調整 */
    .table-container {
      max-height: calc(100vh - 220px);
      overflow-x: auto;
      overflow-y: auto;
      border: 1px solid #B1DCE5;
      margin: 10px auto;
      width: fit-content; /* 右側の余計な空白を無くす */
      max-width: 100%;
    }

    .daysTable {
      border-collapse: collapse;
    }

    .daysTable thead td {
      position: sticky;
      top: 0;
      z-index: 2;
    }

    /* CSS詳細度の問題で色が上書きされない対策 */
    .daysTable thead td.fontRed {
      color: #FF0000 !important;
    }
    .daysTable thead td.fontBlue {
      color: #0000FF !important;
    }
    .daysTable thead td.fontBlack {
      color: #000000 !important;
    }



    #resize select {
      box-sizing: border-box;
      width: 100%;
    }
  </style>
</head>

            <option th:each="yearMonth : ${yearMonthValues}"

                    th:selected="${yearMonth} == *{yearMonth}" 
                    th:text="${yearMonth}">
            </option>
          </select>
          <button type="submit" value="search" class="smallButton" style="width: 60px; height: 26px;">検索</button>
        </div>

                <td th:each="dateBean : ${dateBeanList}"

                    style="width: 40px; text-align: center; vertical-align: middle;">
                  <span th:text="${dateBean.weekDay}"></span>
                </td>
              </tr>
            </thead>
            <tbody>

<!-- 川・波なみアニメーション -->
